name: spiritual_app
description: A production-ready spiritual mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Permissions
  permission_handler: ^11.0.1
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^12.0.0
  
  # UI
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1  # explicit dep — used directly in image_preloader_service
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  
  # Utilities
  intl: ^0.20.2
  share_plus: ^7.2.1
  url_launcher: ^6.2.1
  uuid: ^4.5.1
  
  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  
  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5
  
  # Charts
  fl_chart: ^0.69.0
  
  # Web
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.12.1
  webview_flutter_wkwebview: ^3.9.4
  youtube_player_flutter: ^9.0.3
  
  # DI
  get_it: ^7.6.4
  
  # API (future)
  dio: ^5.4.0
  http: ^1.1.0
  
  # Crypto for cache keys
  crypto: ^3.0.3
  
  # OTP - Firebase Phone Auth (via firebase_auth)
  # sendotp_flutter_sdk removed — using Firebase instead

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^7.2.0
  # google_sign_in_web is bundled in 7.x — no separate package needed
  
  # Push Notifications
  onesignal_flutter: ^5.2.5
  
  # Local Notifications for Reminders
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  # File Picker and Path Provider
  path_provider: ^2.1.1
  image_picker: ^1.0.7
  
  # Wallpaper Manager - Using alternative approach
  # flutter_wallpaper_manager: ^0.0.3  # Has compatibility issues
  # Using native Android implementation instead
  
  # Background Work - Using alternative approach
  # workmanager: ^0.5.2  # Has compatibility issues
  # Using native Android AlarmManager instead
  
  # Connectivity
  connectivity_plus: ^6.0.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # App Info for version tracking
  package_info_plus: ^8.0.0
  
  # Keep screen on during video playback
  wakelock_plus: ^1.3.3
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    # Essential UI images only (logo for splash screen and meditation)
    # All other images loaded from Cloudflare R2 dynamically
    - assets/images/Guruji_logo.JPG
    - assets/images/Guruji_Meditation.PNG
    - assets/images/Guruji-quotes.png
    - assets/images/kalpataru-bg.png
    - assets/images/icons/
    - assets/translations/
    - assets/icons/
    - assets/hls.min.js
    # Audio files for ringtone and meditation
    - assets/audio/Sivoham_ringtone.mp3
    - assets/audio/Meditation_start.mp3
    - assets/audio/Meditation_end.mp3
    - assets/audio/Sivoham_Mantra_10min_guided_Meditation.mp3
    - assets/audio/Sivoham_Mantra_15min_guided_Meditation.mp3
    # Note: Bhajans/music streamed from R2 CDN
    # Images loaded from R2 and cached locally by cached_network_image package

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Guruji_logo.JPG"
  adaptive_icon_background: "#FFFBF5"
  adaptive_icon_foreground: "assets/images/Guruji_logo.JPG"
